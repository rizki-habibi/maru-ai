name: Railway Diagnose

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose GitHub source for Railway
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect source
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SOURCE IDENTITY ==="
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Branch:     ${GITHUB_REF_NAME}"
          echo "Commit:     ${GITHUB_SHA}"
          echo
          echo "=== FILES ==="
          find . -type f -not -path './.git/*' -print | sort
          echo
          echo "=== APPLICATION CHECK ==="
          missing=0
          for file in package.json next.config.mjs app/page.js app/layout.js app/globals.css; do
            if [ -f "$file" ]; then
              echo "OK:   $file"
            else
              echo "MISS: $file"
              missing=1
            fi
          done
          echo
          echo "=== RAILWAY CONFIG CHECK ==="
          if [ -f railway.toml ]; then
            echo "FOUND: railway.toml"
            sed -n '1,220p' railway.toml
          elif [ -f railway.json ]; then
            echo "FOUND: railway.json"
            sed -n '1,220p' railway.json
          else
            echo "INFO: no Railway config file"
          fi
          echo
          echo "=== RESULT ==="
          if [ "$missing" -eq 0 ]; then
            echo "RESULT: Next.js application files are present."
            echo "If Railway serves another application, inspect Railway source/commit selection."
          else
            echo "RESULT: Expected Next.js files are absent."
            echo "Repository does not contain the old Maru AI application."
            echo "If Railway still serves the old app, it is using an old snapshot or another source."
          fi
